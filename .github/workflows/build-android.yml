name: Build Mori-AIXI Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: mori-aixi-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mori-AIXI APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Ambil source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Periksa struktur proyek
      - name: Verify Project
        run: |
          set -e

          test -f package.json
          test -f capacitor.config.json
          test -f public/index.html
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f scripts/smoke-test.js

          echo "Mori-AIXI source verified"

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Setup Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 5. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # 6. Install Android SDK
      - name: Install SDK Components
        run: |
          set -e

          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      # 7. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 8. Install dependencies
      - name: Install Dependencies
        run: |
          npm install --no-audit --no-fund

      # 9. Test application
      - name: Test Mori-AIXI
        run: npm test

      # 10. Sync Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 11. Build APK
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # 12. Verify APK
      - name: Verify APK
        run: |
          set -e

          mkdir -p dist

          APK=$(find android/app/build/outputs/apk/debug \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK not found!"
            exit 1
          fi

          test -s "$APK"

          cp "$APK" dist/Mori-AIXI.apk

          echo "APK BUILD SUCCESSFUL"

          sha256sum dist/Mori-AIXI.apk

          ls -lh dist/Mori-AIXI.apk

      # 13. Upload APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mori-AIXI-APK
          path: dist/Mori-AIXI.apk
          if-no-files-found: error
          retention-days: 30

      # 14. Attach APK to Release
      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mori-AIXI.apk
