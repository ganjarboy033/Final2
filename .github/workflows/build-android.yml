name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build and verify Mori-AIXI APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify project files
        run: |
          test -f package.json
          test -f capacitor.config.json
          test -f public/index.html
          test -f android/gradlew
          test -f android/app/build.gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      # This repository currently has no package-lock.json.
      # npm install is used until a lockfile is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run project smoke tests
        run: npm test

      # Mori serves its web app directly from public/, so there is no
      # separate frontend compilation step in the current package.json.
      - name: Sync Capacitor assets and native plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t APKS < <(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one debug APK; found ${#APKS[@]}"
            printf '%s\n' "${APKS[@]}"
            exit 1
          fi
          test -s "${APKS[0]}"
          cp "${APKS[0]}" dist/Mori-AIXI-debug.apk
          sha256sum dist/Mori-AIXI-debug.apk
          ls -lh dist/Mori-AIXI-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mori-AIXI-APK
          path: dist/Mori-AIXI-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach APK to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Mori-AIXI-debug.apk
